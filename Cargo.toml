[package]
name = "Pong0"
version = "0.1.0"
edition = "2024"

[lib]
name = "pong_lib"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"
required-features = ["client"]

[dependencies]
macroquad = { version = "0.4.16", optional = true }

[features]
default = ["client"]
client = ["dep:macroquad"]
